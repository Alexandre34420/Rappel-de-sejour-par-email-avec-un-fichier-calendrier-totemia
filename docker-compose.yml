services:
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "8080:80"   # externe 8080 → interne 80 (Nginx)
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "5000:5000" # externe 5000 → interne 5000 (Express)
    environment:
      - PORT=5000
      - EMAIL_HOST=mailhog
      - EMAIL_PORT=1025
    depends_on:
      - mailhog

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "8025:8025" # Interface web MailHog
      - "1025:1025" # SMTP

