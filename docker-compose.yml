version: "3.9"

services:
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:80"   # Frontend servi par Nginx
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "5000:5000" # Backend Express
    environment:
      - PORT=5000
      - EMAIL_HOST=mailhog
      - EMAIL_PORT=1025
    depends_on:
      - mailhog

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "8025:8025" # Interface web MailHog
      - "1025:1025" # SMTP
